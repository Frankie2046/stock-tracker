services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-app:latest
    container_name: stock-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"