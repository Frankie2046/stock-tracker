name: Deploy to CN Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 仅拉取仓库 metadata（为了 Actions 识别）
      - name: Checkout
        uses: actions/checkout@v4
        with:
            ref: main
      # 通过 SSH 连接服务器执行 deploy.sh
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "===== START REMOTE DEPLOY ====="
            cd /srv/stock-tracker
            ./scripts/deploy.sh
            echo "===== END REMOTE DEPLOY ====="